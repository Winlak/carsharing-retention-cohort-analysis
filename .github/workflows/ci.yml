name: reproducibility

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install locked environment
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.lock
      - name: Rebuild synthetic analysis and execute notebook
        run: make all notebook
      - name: Lint and test key calculations
        run: make check
