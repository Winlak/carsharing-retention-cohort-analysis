name: reproducibility

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install locked environment
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.lock
      - name: Rebuild analysis, execute notebook and run checks
        run: make reproduce
      - name: Verify deterministic worktree
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          test "$(find data/generated -maxdepth 1 -type f -exec basename {} \; | LC_ALL=C sort)" = "$(printf '%s\n' analysis.sqlite metadata.json rides.csv users.csv)"
          test "$(find figures -maxdepth 1 -type f ! -name .gitkeep -exec basename {} \; | LC_ALL=C sort)" = "$(printf '%s\n' cohort_heatmap.svg early_week_vs_d30.svg first_experience_vs_d30.svg retention_curves.svg ride_gap_distribution.svg)"
